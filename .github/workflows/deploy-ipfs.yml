name: Deploy to IPFS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tina build
        run: npx tinacms build
        env:
          TINA_CLIENT_ID: ${{ secrets.TINACLIENTID }}
          TINA_TOKEN: ${{ secrets.TINATOKEN }}

      - name: Next build
        run: npx next build
        env:
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

      - name: Pack site into CAR file
        run: npx --yes ipfs-car pack out/ --output site.car

      - name: Upload CAR to Filebase (IPFS pinning)
        id: upload
        env:
          FILEBASEKEY: ${{ secrets.FILEBASEKEY }}
          FILEBASESECRET: ${{ secrets.FILEBASESECRET }}
          FILEBASEBUCKET: ${{ secrets.FILEBASEBUCKET }}
          RUN_ID: ${{ github.run_id }}
        run: |
          npm install --no-save @aws-sdk/client-s3
          node <<'EOF'
          const { S3Client, PutObjectCommand, HeadObjectCommand } = require("@aws-sdk/client-s3");
          const fs = require("fs");
          (async () => {
            const s3 = new S3Client({
              endpoint: "https://s3.filebase.com",
              region: "us-east-1",
              credentials: {
                accessKeyId: process.env.FILEBASEKEY,
                secretAccessKey: process.env.FILEBASESECRET,
              },
            });
            const Bucket = process.env.FILEBASEBUCKET;
            const Key = `deploy-${process.env.RUN_ID}.car`;
            await s3.send(new PutObjectCommand({ Bucket, Key, Body: fs.readFileSync("site.car") }));
            const head = await s3.send(new HeadObjectCommand({ Bucket, Key }));
            const cid = head.Metadata && head.Metadata.cid;
            if (!cid) throw new Error("No CID returned in object metadata");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `cid=${cid}\n`);
            console.log(`CID: ${cid}`);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Create Cloudflare Pages project
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.DNSAPITOKEN }}
          accountId: ${{ secrets.CLOUDFLAREACCOUNTID }}
          command: pages project create society-protocol --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.DNSAPITOKEN }}
          accountId: ${{ secrets.CLOUDFLAREACCOUNTID }}
          command: pages deploy out/ --project-name=society-protocol

      - name: Deployment summary
        if: steps.upload.outputs.cid != ''
        run: |
          echo "## Deployment Complete"
          echo "CID: ${{ steps.upload.outputs.cid }}"
          echo "IPFS: https://ipfs.filebase.io/ipfs/${{ steps.upload.outputs.cid }}"
          echo "Site: https://new.societyprotocol.io"
